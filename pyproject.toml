[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sopvid"
version = "0.1.0"
description = "AI Co-Pilot Video-to-SOP: video -> transcripción -> pasos indexados -> búsqueda y chat al segundo exacto."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "LicenseRef-Proprietary"  # NDA Alignity IQ Edge
authors = [
    { name = "Marie Kate Palau" },
    { name = "Emmanuel Merida" },
    { name = "Sara Castillo" },
]
# Versiones fijadas a propósito: el sistema debe reproducirse en una máquina limpia.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.49",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/entregables"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sopvid"]

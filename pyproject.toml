[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sopvid"
version = "0.1.0"
description = "AI Co-Pilot Video-to-SOP: video -> transcripción -> pasos indexados -> búsqueda y chat al segundo exacto."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "LicenseRef-Proprietary"  # NDA Alignity IQ Edge
authors = [
    { name = "Marie Kate Palau" },
    { name = "Emmanuel Merida" },
    { name = "Sara Castillo" },
]
# Versiones fijadas a propósito: el sistema debe reproducirse en una máquina limpia.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.49",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    # Cliente del LLM local (Ollama) y TestClient de FastAPI.
    "httpx==0.28.1",
]

[project.optional-dependencies]
# sopvid.features y los avances académicos; mismas versiones que Avance1.51.ipynb.
# Van aparte para que la imagen Docker de la API no cargue pandas ni scikit-learn.
ml = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    # Lectura de data/interim/htstep/*.parquet (26.0.0 salió el 9 oct 2026; se fija la anterior).
    "pyarrow==25.0.1",
]
notebooks = [
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "ipykernel==7.4.0",
    "nbconvert==7.17.1",
]
dev = [
    "sopvid[ml,notebooks]",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/entregables"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.pep8-naming]
# Convención de scikit-learn: matriz de características en mayúscula.
extend-ignore-names = ["X", "X_*"]

[tool.ruff.lint.isort]
known-first-party = ["sopvid"]

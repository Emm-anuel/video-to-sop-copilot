# Fase F0: API + PostgreSQL 16 con pgvector (base vacía) + Angular en modo desarrollo.
# Uso: copiar .env.example a .env y luego `docker compose up -d --build`.
# El frontend queda en http://localhost:4200; sus errores de compilación, en `docker compose logs -f web`.
# LLM local (opcional): `docker compose --profile llm up -d`. Corre en CPU en cualquier equipo.
# Con GPU NVIDIA, para acelerarlo (ADR-018):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile llm up -d
# Ver docs/dev/llm.md.
name: sopvid

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    # Sin política de reinicio: no arranca sola al prender Docker, para no
    # chocar con otros Postgres locales que usen el mismo puerto.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: sopvid-api:0.1.0
    env_file: .env
    environment:
      # Dentro de la red de compose la base es el servicio "db" en su puerto interno.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Anula una DATABASE_URL local (localhost) que viniera en .env.
      DATABASE_URL: ""
      # Ollama visto desde la red de compose. Sin el profile "llm" el nombre no resuelve
      # y /health informa "llm": "no_disponible" sin afectar a la API.
      LLM_BASE_URL: ${LLM_BASE_URL_API:-http://ollama:11434}
      # Pesos de MiniLM en el volumen "modelos": se descargan una vez y sobreviven a la imagen.
      EMBEDDER_CACHE_DIR: /app/models/embedder
      # Pesos de faster-whisper en el mismo volumen. Sin GPU en este servicio: Whisper en CPU.
      WHISPER_CACHE_DIR: /app/models/whisper
      # El contenedor no tiene GPU (ADR-014): Whisper en CPU, con el mismo modelo que en GPU
      # (ADR-018). Otro modelo (WHISPER_MODELO_CPU=small en .env) da reportes con aviso.
      WHISPER_MODELO_CPU: ${WHISPER_MODELO_CPU:-large-v3-turbo}
      WHISPER_DISPOSITIVO: cpu
      WHISPER_COMPUTE_TYPE: auto
      # Videos subidos, audio y TXT (material del cliente): en el volumen "media", no en la imagen.
      MEDIA_DIR: /app/media
    volumes:
      - modelos:/app/models
      - media:/app/media
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Angular con `ng serve` y recarga en caliente: monta ./frontend, así que lo que se edita en
  # el host se ve al guardar. Sin imagen propia: usa node tal cual (la .dockerignore excluye frontend/).
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    # npm ci solo si cambió package-lock.json (o en el primer arranque); si no, arranca directo.
    # --poll: los cambios de archivos montados desde Windows no llegan como eventos al contenedor.
    command:
      - sh
      - -c
      - >-
        if [ ! -f node_modules/.instalado ] || [ package-lock.json -nt node_modules/.instalado ];
        then npm ci --no-audit --no-fund && touch node_modules/.instalado;
        fi &&
        npx ng serve --host 0.0.0.0 --poll ${WEB_POLL_MS:-2000}
    environment:
      # Destino del proxy /api (frontend/proxy.conf.js). Con la API en el host (make up-gpu):
      # API_URL_WEB=http://host.docker.internal:8000
      API_URL: ${API_URL_WEB:-http://api:8000}
      NG_CLI_ANALYTICS: "false"
    extra_hosts:
      # host.docker.internal también en Docker de Linux (Docker Desktop ya lo trae).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      # node_modules y la caché de Angular de Linux, aparte de los de Windows en ./frontend.
      - web_node_modules:/app/node_modules
      - web_angular_cache:/app/.angular
    ports:
      - "${WEB_PORT:-4200}:4200"

  # ── LLM local (profile "llm"); la API y la base no dependen de estos servicios ──
  ollama:
    image: ollama/ollama:0.40.2
    profiles: ["llm"]
    environment:
      # Flash attention encendido y caché KV en f16 (ADR-006: FA reduce el tiempo a primer token
      # 42-60 % sin cambiar la calidad). Se fija explícito para no depender del valor por defecto
      # de cada versión de Ollama. Para una variante:
      # `OLLAMA_FLASH_ATTENTION=0 docker compose --profile llm up -d ollama`.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      # El modelo sigue en la GPU 30 min tras la última petición (por defecto, 5 min) para no
      # pagar la carga en frío a cada rato; mientras tanto ocupa su VRAM.
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      # Solo en el host local: Ollama no tiene autenticación.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Sin reserva de GPU: así arranca en un equipo sin tarjeta y Gemma corre en CPU (ADR-018).
    # La reserva vive en docker-compose.gpu.yml, que se suma solo donde hay GPU NVIDIA.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Descarga LLM_MODEL una sola vez y termina. Idempotente: si el modelo ya está en el
  # volumen no vuelve a contactar al registro.
  ollama-pull:
    image: ollama/ollama:0.40.2
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if ollama show "$$LLM_MODEL" > /dev/null 2>&1;
        then echo "$$LLM_MODEL ya está descargado";
        else ollama pull "$$LLM_MODEL";
        fi
    restart: "no"

volumes:
  pgdata:
  ollama:
  modelos:
  media:
  web_node_modules:
  web_angular_cache:

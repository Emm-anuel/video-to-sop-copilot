# Fase F0: API + PostgreSQL 16 con pgvector (base vacía).
# Uso: copiar .env.example a .env y luego `docker compose up -d --build`.
# LLM local (opcional, requiere GPU NVIDIA): `docker compose --profile llm up -d`.
# Ver docs/dev/llm.md.
name: sopvid

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    # Sin política de reinicio: no arranca sola al prender Docker, para no
    # chocar con otros Postgres locales que usen el mismo puerto.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: sopvid-api:0.1.0
    env_file: .env
    environment:
      # Dentro de la red de compose la base es el servicio "db" en su puerto interno.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Anula una DATABASE_URL local (localhost) que viniera en .env.
      DATABASE_URL: ""
      # Ollama visto desde la red de compose. Sin el profile "llm" el nombre no resuelve
      # y /health informa "llm": "no_disponible" sin afectar a la API.
      LLM_BASE_URL: ${LLM_BASE_URL_API:-http://ollama:11434}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── LLM local (profile "llm"); la API y la base no dependen de estos servicios ──
  ollama:
    image: ollama/ollama:0.40.2
    profiles: ["llm"]
    environment:
      # Flash attention apagado y caché KV en f16 hasta medirlos en el benchmark (ADR-006).
      # Hay que fijarlo: desde 0.40 Ollama arranca llama-server con --flash-attn auto.
      # Para una variante: `OLLAMA_FLASH_ATTENTION=1 docker compose --profile llm up -d ollama`.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      # El modelo sigue en la GPU 30 min tras la última petición (por defecto, 5 min) para no
      # pagar la carga en frío a cada rato; mientras tanto ocupa su VRAM.
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      # Solo en el host local: Ollama no tiene autenticación.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Descarga LLM_MODEL una sola vez y termina. Idempotente: si el modelo ya está en el
  # volumen no vuelve a contactar al registro.
  ollama-pull:
    image: ollama/ollama:0.40.2
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e2b-it-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if ollama show "$$LLM_MODEL" > /dev/null 2>&1;
        then echo "$$LLM_MODEL ya está descargado";
        else ollama pull "$$LLM_MODEL";
        fi
    restart: "no"

volumes:
  pgdata:
  ollama:

@if (error(); as mensaje) {
  <p class="error" role="alert">{{ mensaje }}</p>
}
@if (video(); as v) {
  @if (v.proceso === 'error') {
    <p class="error" role="alert">No se pudo generar el SOP: {{ v.error }}</p>
  } @else if (v.proceso !== 'listo') {
    <div class="avance" role="status">
      <p>{{ etapa() }}…</p>
      <progress max="100" [value]="v.progreso"></progress>
    </div>
  } @else if (v.sop_id != null) {
    <app-sop-editor [id]="v.sop_id" [videoId]="videoId" />
  } @else {
    <p class="error" role="alert">El video terminó sin SOP generado.</p>
  }
}

@if (!consulta()) {
  <header class="barra">
    <a routerLink="/nuevo" class="marca">SOPVID</a>
    <span class="lema">Validación de video contra SOP</span>
    <nav class="menu" aria-label="Principal">
      <a routerLink="/sops" routerLinkActive="activo" ariaCurrentWhenActive="page">Biblioteca</a>
      <a routerLink="/nuevo" routerLinkActive="activo" ariaCurrentWhenActive="page"
        >Nuevo análisis</a
      >
      <a routerLink="/videos" routerLinkActive="activo" ariaCurrentWhenActive="page">Videos</a>
      @if (conSesionDeCarga()) {
        <button type="button" class="salir" (click)="salir()">Salir</button>
      }
    </nav>
  </header>
}
<main class="contenido" [class.ancho]="ancho()" [class.consulta]="consulta()">
  <router-outlet />
</main>

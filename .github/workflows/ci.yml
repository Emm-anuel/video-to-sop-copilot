name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: sopvid
          POSTGRES_USER: sopvid
          POSTGRES_PASSWORD: sopvid-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sopvid -d sopvid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sopvid
      POSTGRES_USER: sopvid
      POSTGRES_PASSWORD: sopvid-ci-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint y formato)
        run: |
          ruff check .
          ruff format --check .

      - name: Migraciones
        run: alembic upgrade head

      - name: Pytest
        run: pytest
